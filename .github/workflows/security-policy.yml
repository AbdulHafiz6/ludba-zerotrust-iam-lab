name: Zero Trust Policy Security Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-validation:
    name: Validate Zero Trust Policies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Keycloak realm JSON
        run: |
          jq -e . keycloak/ludbA-bank-realm.json > /dev/null
          jq -e '.realm == "ludbA-bank"' keycloak/ludbA-bank-realm.json > /dev/null
          echo "Keycloak startup-import realm JSON is valid"

      - name: Validate Keycloak MFA and OIDC security settings
        run: |
          jq -e '
            .otpPolicyType == "totp" and
            (.defaultRequiredActions | index("CONFIGURE_TOTP") != null) and
            (.clients[] | select(.clientId == "ludba-portal") |
              .attributes["pkce.code.challenge.method"] == "S256" and
              .redirectUris == ["http://localhost:8080/callback"] and
              .directAccessGrantsEnabled == false and
              .implicitFlowEnabled == false)
          ' keycloak/ludbA-bank-realm.json > /dev/null
          echo "Keycloak MFA enrollment and OIDC client settings are valid"

      - name: Validate Keycloak API audience configuration
        run: |
          jq -e '
            (.clients[] | select(.clientId == "ludba-api") |
              .bearerOnly == true and
              .standardFlowEnabled == false and
              .directAccessGrantsEnabled == false and
              .serviceAccountsEnabled == false) and
            (.clients[] | select(.clientId == "ludba-portal") |
              any(.protocolMappers[]?;
                .name == "ludba-api-audience" and
                .protocolMapper == "oidc-audience-mapper" and
                .config["included.client.audience"] == "ludba-api" and
                .config["access.token.claim"] == "true" and
                .config["id.token.claim"] == "false"))
          ' keycloak/ludbA-bank-realm.json > /dev/null
          echo "Dedicated ludba-api audience and access-token mapper are valid"

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "Docker Compose configuration is valid"

      - name: Install Open Policy Agent
        run: |
          curl -fL -o opa \
            https://openpolicyagent.org/downloads/v1.4.2/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Validate Rego policies
        run: opa check --strict policies/

      - name: Run access control tests
        run: opa test policies/ -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate gateway JavaScript syntax
        run: |
          find gateway/src gateway/test -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run gateway unit tests
        working-directory: gateway
        run: node --test
