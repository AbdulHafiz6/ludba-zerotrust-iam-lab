
name: Zero Trust Policy Security Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-validation:
    name: Validate Zero Trust Policies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Open Policy Agent
        run: |
          curl -fL -o opa \
            https://openpolicyagent.org/downloads/v1.4.2/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Validate Rego policies
        run: opa check --strict policies/

      - name: Run access control tests
        run: opa test policies/ -v
